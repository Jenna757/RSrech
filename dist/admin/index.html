<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>RS Technologies｜網站管理</title><link rel="stylesheet" href="/admin/admin.css"><script defer src="/admin/admin.js"></script></head><body><aside><a class="brand" href="/">RS<span>TECHNOLOGIES</span></a><p>網站管理中心</p><nav><button id="messages-tab" class="active">客戶留言</button><button id="content-tab">網站內容</button></nav><div class="aside-bottom"><a href="/" target="_blank" rel="noopener">查看官網 ↗</a><button id="logout" hidden>登出</button></div></aside><main><header><div><small>RS TECHNOLOGIES / CONTENT STUDIO</small><h1 id="page-title">歡迎回來</h1></div><span class="badge">管理員專區</span></header><p id="notice" role="status" aria-live="polite"></p><section id="login"><h2>登入管理中心</h2><p>查看客戶查詢，讓網站內容保持最新。</p><form id="login-form"><label>管理員密碼<input type="password" name="password" autocomplete="current-password" required></label><button class="primary">登入 →</button></form><p class="hint">首次使用需在 Cloudflare 設定 ADMIN_PASSWORD Secret（至少 16 字元）。</p></section><section id="workspace" hidden><section id="messages-panel"><div class="toolbar"><p id="message-count"></p><button id="refresh">重新整理</button></div><div id="messages"></div><div class="toolbar"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></div></section><section id="content-panel" hidden><div class="toolbar"><p>編輯後按「儲存並發布」，新內容即會套用至官網。</p><button id="save" class="primary">儲存並發布</button></div><label class="search-label">搜尋內容<input id="search" type="search" placeholder="輸入文字以尋找欄位"></label><div id="editor"></div></section></section></main></body></html>
